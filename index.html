<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MathCS — Learn the mathematics behind computer science. Deep curriculum, interactive visualizations, proofs, and real CS applications." />
    <meta name="theme-color" content="#1B2A41" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B2A41'/%3E%3Ctext x='16' y='22.5' font-family='Georgia,serif' font-size='19' fill='%23FBFAF7' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E" />
    <title>MathCS — Mathematics for Computer Science</title>
    <script>
      // Apply the stored theme before CSS or React paint, preventing a white
      // flash when a reader prefers dark mode.
      (function () {
        try {
          var preference = localStorage.getItem('mathcs-theme');
          var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
